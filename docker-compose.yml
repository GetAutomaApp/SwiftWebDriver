services:
  httpd:
    build:
      context: .
      dockerfile: ./infra/HTTPDDockerfile
    volumes:
      - ./TestAssets:/usr/local/apache2/htdocs/
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  selenium_chrome:
    image: selenium/standalone-chrome:4.2.1-20220531
    ports:
      - 4444:4444
      - 7900:7900
    environment:
      SE_NODE_MAX_SESSIONS: "${SELENIUM_MAX_SESSIONS:-4}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  selenium_firefox:
    image: selenium/standalone-firefox:152.0-20260606
    ports:
      - 4445:4444
      - 7901:7900
    environment:
      SE_NODE_MAX_SESSIONS: "${SELENIUM_MAX_SESSIONS:-4}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  swift_web_driver: &SwiftWebDriver
    build:
      context: .
      dockerfile: ./infra/Dockerfile
    volumes:
      - .:/SwiftWebDriver
    working_dir: /SwiftWebDriver
    environment:
      CHROME_SELENIUM_URL: http://selenium_chrome:4444
      FIREFOX_SELENIUM_URL: http://selenium_firefox:4444
      TEST_SERVER_URL: http://httpd
    tty: true
    depends_on:
      selenium_chrome:
        condition: service_healthy
      selenium_firefox:
        condition: service_healthy
      httpd:
        condition: service_healthy

  build:
    <<: *SwiftWebDriver
    command: /bin/bash -xcl "swift build"

  test:
    <<: *SwiftWebDriver
    command: /bin/bash -xcl "swift test -Xswiftc -warnings-as-errors $${SANITIZER_ARG-}"

  shell:
    <<: *SwiftWebDriver
    entrypoint: /bin/bash
